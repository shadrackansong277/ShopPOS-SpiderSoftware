<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopPOS Cloud - Sign In</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">ShopPOS <span>Cloud</span></div>
    <p class="login-sub">Sign in to view your shop from anywhere</p>

    <div id="err" class="banner banner-error" style="display:none"></div>

    <form id="login-form">
      <div class="fgroup">
        <label>Owner Email</label>
        <input class="finput" id="email" type="email" autocomplete="username" required>
      </div>
      <div class="fgroup">
        <label>Password</label>
        <input class="finput" id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-accent btn-block" type="submit" id="submit-btn">Sign In</button>
    </form>

    <p class="login-hint">
      Use the same email and password you entered in ShopPOS under
      Settings &rarr; Remote Access when you enabled remote access.
    </p>
  </div>

  <script>
    async function sha256Hex(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("err");
      const btn = document.getElementById("submit-btn");
      errEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Signing in…";

      try {
        const password_hash = await sha256Hex(password);
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password_hash }),
        });
        const data = await r.json();
        if (data.ok) {
          window.location.href = "/dashboard";
        } else {
          errEl.textContent = data.error || "Sign in failed";
          errEl.style.display = "block";
        }
      } catch (err) {
        errEl.textContent = "Could not reach the server. Try again.";
        errEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
